<!DOCTYPE html>
<!--
THESIS: 把“先选平台”改成“先选图片或视频任务”，拒绝把四个网站堆成无上下文标签栏。
OWN-WORLD: 延续视频制作 OS 的明亮 macOS 工作台；图片模式用 Apple 蓝，视频模式用克制的珊瑚红，只为状态和主操作着色。
STORY: 用户选模式、整理提示词、进入对应平台、下载结果，并在同一视野确认归档位置与进度。
FIRST VIEWPORT: 顶部模式与平台导航，左侧固定提示词工作区，右侧占主面积的真实网页浏览区，下载状态在左侧下方持续可见。
FORM: 现有桌面工作台的 Operate 模式扩展；高密度、标准控件、无装饰性入场动画。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f5f5f7">
  <title>创作浏览器｜视频制作 OS</title>
  <link rel="icon" type="image/png" href="assets/ui/creator/studio-3d-v1.png">
  <link rel="stylesheet" href="creator.css">
  <link rel="stylesheet" href="assets/ui/creator/ui-icons.css">
</head>
<body data-mode="image" data-ready="loading">
  <div class="creator-shell">
    <header class="creator-header">
      <div class="creator-brand">
        <span class="creator-mark" data-ui-icon="studio" aria-hidden="true"></span>
        <strong>创作浏览器</strong>
      </div>

      <div class="mode-switch" role="group" aria-label="创作模式">
        <button class="mode-button" data-mode="image" aria-pressed="true">
          <span data-ui-icon="image" aria-hidden="true"></span>
          图片模式
        </button>
        <button class="mode-button" data-mode="video" aria-pressed="false">
          <span data-ui-icon="video" aria-hidden="true"></span>
          视频模式
        </button>
      </div>

      <div class="platform-strip">
        <nav class="platform-tabs" id="platformTabs" aria-label="已打开的创作网页"></nav>
        <button class="platform-add" id="addPlatform" type="button" aria-label="再开或打开创作网站" aria-expanded="false" aria-controls="platformPopover" title="再开一个网页／打开其他网站">＋</button>
        <button class="quiet-button clear-browser-tabs" id="clearBrowserTabs" type="button" title="关闭图片和视频模式的全部网页，保留网站登录和素材">清空网页</button>
      </div>

      <div class="header-actions">
        <span class="download-badge hidden" id="downloadBadge" role="status">⬇ 正在下载 0 项</span>
        <button class="project-chip" id="currentProject" type="button" title="切换剧本" aria-label="切换当前剧本" aria-haspopup="menu" aria-expanded="false">当前剧本</button>
        <button class="asset-toggle" id="toggleAssets" type="button" aria-pressed="true" title="打开或关闭创作资产库">
          <span data-ui-icon="library" aria-hidden="true"></span>
          创作资产
        </button>
        <button class="icon-button" id="togglePrompt" title="收起或展开创作材料栏" aria-label="收起或展开创作材料栏" aria-controls="promptPanel" aria-expanded="true">◧</button>
        <button class="quiet-button" id="showMainWindow">返回制作 OS</button>
      </div>

      <div class="platform-popover hidden" id="platformPopover">
        <button class="secondary-action platform-duplicate" id="duplicateTab" type="button" title="为当前网站再开一个独立网页，适合批量生成">
          再开一个「<span id="duplicateTabLabel">当前网站</span>」网页
        </button>
        <section class="popover-section" aria-label="打开或管理创作网站">
          <div class="popover-section-title">打开或管理网站</div>
          <div class="platform-open-list" id="platformOpenList"></div>
        </section>
        <form class="platform-form" id="platformForm" novalidate>
          <input id="platformName" type="text" maxlength="40" autocomplete="off" aria-label="网站名称" placeholder="网站名称">
          <input id="platformUrl" type="url" maxlength="2048" autocomplete="off" spellcheck="false" aria-label="网站地址" placeholder="粘贴 https:// 网站地址">
          <button class="primary-action" type="submit">添加网址</button>
          <button class="text-action" id="cancelPlatform" type="button">取消</button>
        </form>
        <section class="hidden-platforms" id="hiddenPlatforms" aria-labelledby="hiddenPlatformsTitle" hidden>
          <div class="hidden-platforms-head">
            <span id="hiddenPlatformsTitle">已从顶部移除</span>
            <button class="text-action" id="restoreAllPlatforms" type="button">全部恢复</button>
          </div>
          <div class="hidden-platform-list" id="hiddenPlatformList"></div>
        </section>
      </div>
    </header>

    <main class="creator-workspace">
      <aside class="prompt-panel material-sidebar" id="promptPanel" aria-label="创作材料">
        <div class="material-sidebar-head">
          <div>
            <span>CREATION KIT</span>
            <h1>创作材料</h1>
          </div>
          <span class="sr-only" id="draftStatus" aria-live="polite">已在本机自动保存</span>
        </div>

        <details class="material-accordion prompt-accordion" id="promptAccordion">
          <summary>
            <span class="accordion-icon prompt" data-ui-icon="sparkle" aria-hidden="true"></span>
            <span class="accordion-label"><strong>固定提示词</strong><small id="promptAccordionCount">0 条</small></span>
            <span class="accordion-chevron" aria-hidden="true"></span>
          </summary>
          <div class="accordion-body">
            <div class="prompt-editor-head">
              <strong id="promptModeLabel">图片提示词</strong>
              <span class="character-count" id="characterCount">0 字</span>
            </div>
            <textarea id="promptEditor" spellcheck="false" aria-label="当前模式提示词" placeholder="粘贴或输入提示词…"></textarea>
            <div class="prompt-actions">
              <button class="primary-action" id="copyPrompt" type="button" title="复制提示词；⌘Enter = 复制并切到网页">复制</button>
              <button class="text-action" id="clearPrompt" type="button">清空</button>
              <button class="text-action template-create-toggle" id="templateCreate" type="button">＋ 新建固定提示词</button>
            </div>
            <form class="template-create-form hidden" id="templateCreateForm" novalidate>
              <input id="templateCreateName" type="text" maxlength="40" autocomplete="off" placeholder="名称，例如：人物四视图" aria-label="固定提示词名称">
              <textarea id="templateCreateBody" rows="5" spellcheck="false" placeholder="填写提示词，保存后可直接修改标题和内容…" aria-label="固定提示词内容"></textarea>
              <div class="template-create-actions">
                <button class="primary-action" type="submit">保存</button>
                <button class="text-action" id="cancelTemplateCreate" type="button">取消</button>
              </div>
            </form>
            <div class="saved-template-list" id="promptTemplateList" aria-label="已保存的固定提示词"></div>
          </div>
        </details>

        <details class="material-accordion asset-accordion" id="assetAccordion" open>
          <summary>
            <span class="accordion-icon asset" data-ui-icon="library" aria-hidden="true"></span>
            <span class="accordion-label"><strong>创作资产</strong><small id="assetAccordionCount">正在读取</small></span>
            <span class="accordion-chevron" aria-hidden="true"></span>
          </summary>
          <div class="accordion-body">
            <div class="asset-quick-actions">
              <button class="primary-action" id="importLocalAssets" type="button">＋ 添加本地素材</button>
              <button class="secondary-action" id="openAssetLibrary" type="button">打开完整资产库</button>
              <button class="secondary-action" id="toggleDragTray" type="button" title="置顶迷你拖拽窗：拖资产进剪映；Alt+Shift+D 随时开关">剪映联动</button>
            </div>
            <div class="asset-quick-tools" id="quickTools" hidden>
              <button class="secondary-action multi-toggle" id="quickMultiSelect" type="button" aria-pressed="false">框选模式：关</button>
              <span class="quick-sel-info" id="quickSelInfo" aria-live="polite"></span>
              <button class="text-action" id="quickSelClear" type="button" hidden>清空选择</button>
            </div>
            <div class="asset-drop-zone" id="assetDropZone" tabindex="0" role="button" aria-label="拖入网页图片或本地图片、视频、音频">
              <span class="asset-drop-icon" data-ui-icon="import" aria-hidden="true"></span>
              <strong>拖入图片、视频或音频</strong>
              <small id="quickDropTarget">当前存入：全部资产（按类别自动归档）</small>
            </div>
            <nav class="quick-folder-tree" id="quickFolderTree" aria-label="资产分类文件夹"></nav>
            <input id="quickFileInput" type="file" multiple hidden accept="image/*,video/*,audio/*,.mp3,.wav,.m4a,.aac,.flac,.ogg,.opus,.wma,.aiff,.aif,.amr,.ape">

            <section class="downloads-section" aria-labelledby="downloadsHeading">
              <div class="section-heading compact">
                <div>
                  <h2 id="downloadsHeading">最近入库</h2>
                  <span id="downloadSummary" aria-live="polite">还没有下载任务</span>
                </div>
                <button class="text-action" id="openModeFolder" type="button">文件夹</button>
              </div>
              <div class="download-list" id="downloadList" role="region" aria-label="下载入库任务"></div>
            </section>
          </div>
        </details>
      </aside>

      <section class="browser-column" aria-label="平台网页">
        <div class="browser-toolbar">
          <div class="browser-nav" role="group" aria-label="网页导航">
            <button class="icon-button" data-nav="back" title="后退" aria-label="后退" disabled>←</button>
            <button class="icon-button" data-nav="forward" title="前进" aria-label="前进" disabled>→</button>
            <button class="icon-button" data-nav="reload" title="刷新" aria-label="刷新">↻</button>
            <button class="icon-button" data-nav="home" title="平台首页" aria-label="平台首页">⌂</button>
          </div>
          <form class="address-form" id="addressForm" novalidate>
            <span class="load-dot" id="loadDot" aria-hidden="true"></span>
            <span class="address-service" id="addressService">GPT</span>
            <input
              class="address-input"
              id="addressInput"
              type="text"
              inputmode="url"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              aria-label="输入网页地址"
              placeholder="输入网址，例如 gemini.google.com"
            >
            <button class="address-go" id="addressGo" type="submit">前往</button>
          </form>
          <div class="browser-toolbar-actions">
            <button class="quiet-button" id="creatorWorkflowOpen" type="button">制作流程</button>
            <button class="quiet-button" id="importDownloadedFiles" type="button" aria-label="导入下载的文件并归档" title="选择刚从系统浏览器下载的文件并归档">导入文件</button>
            <button class="quiet-button" id="openExternal" type="button" aria-label="在系统浏览器中打开当前页面" title="在系统浏览器中打开当前页面；系统浏览器的登录状态不会同步回内嵌浏览器">外部打开</button>
          </div>

          <div class="browser-recovery" id="browserRecovery" role="alert" aria-live="assertive" aria-atomic="true" hidden>
            <div class="browser-recovery-copy">
              <strong>平台页面加载失败</strong>
              <span id="browserRecoveryMessage">请重新加载，或改用系统浏览器继续。</span>
              <span class="browser-recovery-url" id="browserRecoveryUrl"></span>
            </div>
            <div class="browser-recovery-actions" aria-label="平台加载恢复操作">
              <button class="secondary-action" id="browserRecoveryReload" type="button">重新加载</button>
              <button class="secondary-action" id="browserRecoveryExternal" type="button">系统浏览器继续</button>
              <button class="secondary-action" id="browserRecoveryImport" type="button">导入生成文件</button>
            </div>
          </div>
        </div>

        <div class="browser-stage" id="browserStage">
          <div class="browser-placeholder">
            <span class="placeholder-mark" data-ui-icon="studio" aria-hidden="true"></span>
            <strong id="browserPlaceholderTitle">正在连接创作平台</strong>
            <p>网页没有出现时，可重新挂载当前平台。</p>
            <button class="secondary-action" id="reconnectBrowser" type="button">重新显示网页</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="creator-toast" id="creatorToast" role="status" aria-live="polite"></div>

  <!-- 快捷资产内置预览：图片放大查看、视频/音频直接播放；可跳转完整资产库定位 -->
  <dialog id="quickPreviewDialog" class="creator-dialog quick-preview-dialog" aria-labelledby="quickPreviewName">
    <div class="creator-dialog-sheet quick-preview-sheet">
      <header class="creator-dialog-head">
        <div>
          <h2 id="quickPreviewName">资产预览</h2>
          <p id="quickPreviewMeta"></p>
        </div>
        <button class="icon-button" id="quickPreviewClose" type="button" aria-label="关闭">×</button>
      </header>
      <div class="quick-preview-stage" id="quickPreviewStage"></div>
      <footer class="creator-dialog-foot">
        <button class="secondary-action" id="quickPreviewInLibrary" type="button">在完整资产库中查看</button>
        <button class="primary-action" id="quickPreviewDone" type="button">关闭</button>
      </footer>
    </div>
  </dialog>

  <dialog id="renameDialog" class="creator-dialog rename-dialog" aria-labelledby="renameTitle">
    <form id="renameForm" class="creator-dialog-sheet">
      <header class="creator-dialog-head"><h2 id="renameTitle">修改名称</h2></header>
      <div class="rename-field">
        <input id="renameName" type="text" maxlength="40" autocomplete="off" aria-label="新名称" required>
        <p id="renameError" role="alert"></p>
      </div>
      <footer class="creator-dialog-foot">
        <button id="renameCancel" class="secondary-action" type="button">取消</button>
        <button id="renameSave" class="primary-action" type="submit">保存</button>
      </footer>
    </form>
  </dialog>

  <!-- 清空提示词确认（可选今后都不提醒） -->
  <dialog id="clearPromptDialog" class="creator-dialog" aria-labelledby="clearPromptTitle">
    <div class="creator-dialog-sheet">
      <header class="creator-dialog-head">
        <div>
          <h2 id="clearPromptTitle">清空当前提示词？</h2>
          <p>清空后 5 秒内可撤销。</p>
        </div>
      </header>
      <footer class="creator-dialog-foot">
        <button class="text-action dialog-secondary-action" id="clearPromptNever" type="button">今后都不提醒</button>
        <button class="secondary-action" id="clearPromptCancel" type="button">取消</button>
        <button class="primary-action" id="clearPromptConfirm" type="button">清空</button>
      </footer>
    </div>
  </dialog>

  <script src="assets/ui/creator/ui-icons.js"></script>
<script src="creator.js"></script>
<script src="creator-automation-ui.js"></script>
</body>
</html>
