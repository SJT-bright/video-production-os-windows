<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>剪映联动</title>
  <link rel="stylesheet" href="drag-tray.css">
</head>
<body>
  <header class="tray-head" aria-label="剪映联动悬浮窗，按住标题栏可拖动窗口">
    <div class="tray-title">
      <strong>剪映联动</strong>
      <small id="trayProject">读取中…</small>
    </div>
    <div class="tray-actions">
      <button id="traySelectMode" class="tray-btn tray-btn-wide" type="button" aria-pressed="false" title="多选模式：按顺序点卡片选中，再拖动任一选中卡整批拖进剪映">多选</button>
      <button id="trayRefresh" class="tray-btn" type="button" title="刷新资产列表" aria-label="刷新资产列表">⟳</button>
      <button id="trayClose" class="tray-btn" type="button" title="关闭（Alt+Shift+D 重新打开）" aria-label="关闭悬浮窗">×</button>
    </div>
  </header>
  <div class="tray-tip">导入剪映只用拖拽：把卡片拖到剪映窗口松手</div>
  <div class="tray-chips" id="trayChips" role="tablist" aria-label="资产类型筛选">
    <button class="chip on" data-filter="video" type="button" aria-label="切换到视频板块">视频</button>
    <button class="chip" data-filter="audio" type="button" aria-label="切换到音频板块">音频</button>
  </div>
  <div class="tray-list" id="trayList" role="list" aria-label="可拖拽资产">
    <div class="tray-state">正在读取资产…</div>
  </div>
  <div class="tray-batch" id="trayBatch" hidden>
    <span class="tray-batch-hint" id="trayBatchHint">拖动任一选中卡，整批拖进剪映</span>
    <button class="tray-clear-btn" id="trayClearSelection" type="button">清空选择</button>
  </div>
  <div class="tray-status" id="trayStatus" role="status" aria-live="polite"></div>
  <div class="tray-toast" id="trayToast" role="status" aria-live="polite"></div>
  <script src="assets/ui/asset-order.js"></script>
  <script src="assets/ui/video-disposition.js"></script>
  <script src="drag-tray.js"></script>
</body>
</html>
