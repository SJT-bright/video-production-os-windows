name: Release Windows EXE

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (例如：v1.0.0)'
        required: true
  push:
    tags:
      - 'v*'

jobs:
  build-windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Electron Windows runtime
        shell: pwsh
        run: |
          node node_modules/electron/install.js
          if (-not (Test-Path "node_modules/electron/dist/electron.exe")) {
            throw "未找到 node_modules/electron/dist/electron.exe，无法继续打包"
          }

      - name: Build Windows package
        run: npm run build:desktop

      - name: Verify exe output
        run: |
          if (-not (Test-Path "dist/视频制作OS-win32-x64/视频制作OS.exe")) {
            throw "未找到 dist/视频制作OS-win32-x64/视频制作OS.exe，请检查构建日志。"
          }

      - name: Publish to GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          name: Windows EXE ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          body: |
            视频制作 OS Windows 发行版（可直接下载 exe）
            - 下载 `视频制作OS.exe` 后双击打开（Windows）
            - 该包由 `npm run build:desktop` 自动生成，兼容 64 位 Windows
          generate_release_notes: false
          prerelease: false
          files: |
            dist/视频制作OS-win32-x64/视频制作OS.exe
