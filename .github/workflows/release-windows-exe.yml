name: Release Windows EXE

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (例如：v1.0.0)'
        required: true
  push:
    tags:
      - 'v*'

jobs:
  build-windows-exe:
    if: github.repository == 'SJT-bright/video-production-os-windows'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check source and retention
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:browser-session
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows package
        run: npm run build:windows:release

      - name: Verify packaged resources and launch EXE
        run: node test_windows_release.cjs

      - name: Archive complete application
        run: |
          Compress-Archive -Path "dist/视频制作OS-win32-x64" -DestinationPath "dist/VideoProductionOS-Windows-x64.zip" -CompressionLevel Optimal
          $digest = (Get-FileHash "dist/VideoProductionOS-Windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$digest  VideoProductionOS-Windows-x64.zip" | Set-Content -Path "dist/SHA256SUMS.txt" -Encoding ascii

      - name: Publish to GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Windows EXE ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE-NOTES.md
          generate_release_notes: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/VideoProductionOS-Windows-x64.zip
            dist/SHA256SUMS.txt
