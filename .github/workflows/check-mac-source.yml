name: Reproduce Mac source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-mac-build:
    if: github.repository == 'SJT-bright/video-production-os'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout fixed source
        uses: actions/checkout@v4
        with:
          path: 视频制作OS
      - name: Setup pinned Node
        uses: actions/setup-node@v4
        with:
          node-version-file: 视频制作OS/.nvmrc
          cache: npm
          cache-dependency-path: 视频制作OS/package-lock.json
      - name: Install locked dependencies
        working-directory: 视频制作OS
        run: npm ci --no-audit --no-fund
      - name: Prepare local audio component
        working-directory: 视频制作OS
        run: node prepare-media-tools.cjs darwin arm64
      - name: Source workflow checks
        working-directory: 视频制作OS
        run: npm run test:source
      - name: Build isolated Apple Silicon App
        working-directory: 视频制作OS
        run: npm run build:mac -- --arch arm64 --portable
      - name: Launch packaged App with fresh user data
        working-directory: 视频制作OS
        run: node test_mac_release.cjs --arch arm64
      - name: Verify bundled audio workflow
        working-directory: 视频制作OS
        env:
          VOICE_TEST_APP_ROOT: dist/public-release/视频制作 OS-darwin-arm64/视频制作 OS.app/Contents/Resources/app
        run: node test_voice_clips.cjs

# No upload/release step: this is source reproduction, not distribution of
# the upstream audio binary or the locally signed App.
