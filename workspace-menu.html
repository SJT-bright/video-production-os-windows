<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作区菜单</title>
  <link rel="stylesheet" href="workspace-menu.css">
</head>
<body>
  <main id="workspaceMenu" role="dialog" aria-label="工作区菜单">
    <div class="menu-head"><span id="menuTitle">工作区</span><button id="dismiss" type="button" aria-label="关闭菜单">×</button></div>
    <input id="menuSearch" type="search" autocomplete="off" aria-label="搜索网页" placeholder="搜索网页名称或平台…" hidden>
    <p id="menuHint" hidden>右键剧本，可迁移固定提示词</p>
    <div id="menuList" role="listbox" aria-label="可选择项目"></div>
    <div id="projectContext" role="menu" aria-label="剧本操作" hidden><button id="migrate" type="button" role="menuitem">迁移固定提示词…</button></div>
    <button id="manage" class="manage" type="button" hidden>新建或管理剧本…</button>
  </main>
  <script src="workspace-menu.js"></script>
</body>
</html>
